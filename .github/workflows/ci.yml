# Verificação de cada push e pull request: lint, tipos e testes das regras puras.
# Não acessa o Supabase (os testes não usam banco) e não faz deploy (a Vercel cuida disso).
name: CI

on:
  push:
    branches: [main, refatoracao]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
